<script>
document.addEventListener('DOMContentLoaded', function () {
  document.body.classList.add('js-enhanced');
  initRotators();
  initFavoriteLines();
  initPoemBuilder();
  initRandomLines();
  initBodyResponses();
  initBlogListingMeta();
  initPageCompanions();
  initResearchBackgrounds();
  initResearchMarginNotes();
  initHashLandingAdjustments();
  initBirdSeparators();
  initQuoteFadeIn();
  initHomepageOrder();
  initProblemMap();
});

function initProblemMap() {
  const viewport = document.querySelector('[data-map-viewport]');
  const canvas = document.querySelector('[data-map-canvas]');
  if (!viewport || !canvas) return;
  const map = viewport.closest('.home-process-map');
  let scale = 1;
  let x = 0;
  let y = 0;
  let dragging = false;
  let startX = 0;
  let startY = 0;

  const apply = () => {
    canvas.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    canvas.style.setProperty('--map-scale', scale);
  };
  const zoom = (delta) => {
    scale = Math.min(2.4, Math.max(1, scale + delta));
    if (scale === 1) { x = 0; y = 0; }
    apply();
  };
  map.querySelector('[data-map-zoom-in]')?.addEventListener('click', () => zoom(.2));
  map.querySelector('[data-map-zoom-out]')?.addEventListener('click', () => zoom(-.2));
  map.querySelector('[data-map-reset]')?.addEventListener('click', () => { scale = 1; x = 0; y = 0; apply(); });
  viewport.addEventListener('wheel', (event) => {
    if (!event.ctrlKey && !event.metaKey) return;
    event.preventDefault();
    zoom(event.deltaY < 0 ? .15 : -.15);
  }, { passive: false });
  viewport.addEventListener('pointerdown', (event) => {
    if (scale === 1 || event.target.closest('button, details')) return;
    dragging = true;
    startX = event.clientX - x;
    startY = event.clientY - y;
    viewport.setPointerCapture(event.pointerId);
    viewport.classList.add('is-panning');
  });
  viewport.addEventListener('pointermove', (event) => {
    if (!dragging) return;
    x = event.clientX - startX;
    y = event.clientY - startY;
    apply();
  });
  const stop = () => { dragging = false; viewport.classList.remove('is-panning'); };
  viewport.addEventListener('pointerup', stop);
  viewport.addEventListener('pointercancel', stop);
}

function initHomepageOrder() {
  const intro = document.querySelector('body.home-page .home-intro');
  const quoteIntro = document.querySelector('body.home-page .home-quote-intro');
  const quotes = document.querySelector('body.home-page .quote-section');
  if (!intro || !quoteIntro || !quotes) return;
  intro.insertAdjacentElement('afterend', quotes);
  intro.insertAdjacentElement('afterend', quoteIntro);
}

function initResearchMarginNotes() {
  let noteIndex = 0;
  document.querySelectorAll('.research-project').forEach((project) => {
    const notes = Array.from(project.querySelectorAll('.research-margin-note'));
    notes.forEach((note) => {
      let passage = note.previousElementSibling;
      while (passage && (passage.matches('h3, h4') || passage.classList.contains('research-margin-note'))) {
        passage = passage.previousElementSibling;
      }
      if (!passage) return;
      note.classList.add(noteIndex % 2 ? 'note-left' : 'note-right');
      if (noteIndex % 2) {
        note.style.left = 'auto';
        note.style.right = 'calc(100% + 1.5rem)';
      } else {
        note.style.left = 'calc(100% + 1.5rem)';
        note.style.right = 'auto';
      }
      noteIndex += 1;
      note.style.top = passage.offsetTop + 'px';
      note.tabIndex = 0;
      note.setAttribute('aria-label', `${note.querySelector('.research-margin-label')?.textContent || 'Margin note'} for the nearby passage`);
      passage.classList.add('research-annotated-passage');
      const activate = () => { note.classList.add('is-active'); passage.classList.add('is-note-active'); };
      const deactivate = () => { note.classList.remove('is-active'); passage.classList.remove('is-note-active'); };
      note.addEventListener('mouseenter', activate);
      note.addEventListener('mouseleave', deactivate);
      note.addEventListener('focus', activate);
      note.addEventListener('blur', deactivate);
      passage.addEventListener('mouseenter', activate);
      passage.addEventListener('mouseleave', deactivate);
    });
  });
}

function initRotators() {
  const rotators = document.querySelectorAll('[data-rotator]');

  rotators.forEach((rotator) => {
    const items = Array.from(rotator.querySelectorAll('.rotator-item'));
    const button = rotator.querySelector('.rotator-next');

    if (!items.length || !button) return;

    let index = items.findIndex((item) => item.classList.contains('is-active'));
    if (index < 0) index = 0;

    syncRotator(items, index);

    button.addEventListener('click', function () {
      index = (index + 1) % items.length;
      syncRotator(items, index);
    });
  });
}

function syncRotator(items, activeIndex) {
  items.forEach((item, index) => {
    const isActive = index === activeIndex;
    item.hidden = !isActive;
    item.classList.toggle('is-active', isActive);
  });
}

function initFavoriteLines() {
  const hearts = document.querySelectorAll('.line-heart');
  if (!hearts.length) return;

  const storageKey = 'favoriteLines.v1';
  let saved = {};

  try {
    saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
  } catch (error) {
    saved = {};
  }

  hearts.forEach((button) => {
    const lineId = button.dataset.lineId;
    if (!lineId) return;

    updateHeart(button, Boolean(saved[lineId]));

    button.addEventListener('click', function () {
      const nextState = !button.classList.contains('is-favorite');
      saved[lineId] = nextState;
      updateHeart(button, nextState);
      localStorage.setItem(storageKey, JSON.stringify(saved));
      document.dispatchEvent(new CustomEvent('fieldnotes:changed'));
    });
  });
}

function updateHeart(button, isFavorite) {
  button.classList.toggle('is-favorite', isFavorite);
  button.setAttribute('aria-pressed', isFavorite ? 'true' : 'false');
  button.setAttribute('aria-label', isFavorite ? 'Remove line from Build-a-Poem selection' : 'Add line to Build-a-Poem selection');
  button.textContent = isFavorite ? '✓' : '+';
}

function initPoemBuilder() {
  const builder = document.querySelector('[data-poem-builder]');
  if (!builder) return;

  const count = builder.querySelector('[data-poem-builder-count]');
  const arrangementSelect = builder.querySelector('[data-poem-arrangement]');
  const minimumNote = builder.querySelector('[data-poem-minimum]');
  const output = builder.querySelector('[data-poem-builder-output]');
  const copy = builder.querySelector('[data-poem-copy]');
  const clear = builder.querySelector('[data-poem-clear]');

  const keptLines = function () {
    return Array.from(document.querySelectorAll('.poem-line'))
      .map((line, index) => {
        const marker = line.querySelector('.line-heart');
        const text = line.querySelector('.poem-line-text');
        return {
          index,
          kept: marker && marker.classList.contains('is-favorite'),
          text: text ? text.textContent.trim() : ''
        };
      })
      .filter((line) => line.kept && line.text);
  };

  const sync = function () {
    const lines = keptLines();
    const ready = lines.length >= 3;
    count.textContent = lines.length + (lines.length === 1 ? ' line selected' : ' lines selected');
    arrangementSelect.disabled = !ready;
    minimumNote.hidden = ready;
    clear.disabled = lines.length === 0;
    if (!lines.length) {
      output.hidden = true;
      output.replaceChildren();
      copy.hidden = true;
    }
  };

  const arrange = function (mode) {
    let lines = keptLines();
    if (mode === 'reverse') lines = lines.reverse();
    if (mode === 'breath') lines = lines.sort((a, b) => a.text.length - b.text.length);
    if (mode === 'disturbance') {
      lines = lines
        .map((line) => ({ line, order: Math.random() }))
        .sort((a, b) => a.order - b.order)
        .map((entry) => entry.line);
    }

    output.replaceChildren(...lines.map((line) => makePoemBuilderLine(line.text, mode === 'custom')));
    output.hidden = false;
    copy.hidden = false;
  };

  arrangementSelect.addEventListener('change', function () {
    if (arrangementSelect.value) arrange(arrangementSelect.value);
  });

  let draggedLine = null;
  output.addEventListener('dragstart', (event) => {
    draggedLine = event.target.closest('.poem-builder-line');
    if (draggedLine) draggedLine.classList.add('is-dragging');
  });
  output.addEventListener('dragend', () => {
    draggedLine?.classList.remove('is-dragging');
    draggedLine = null;
  });
  output.addEventListener('dragover', (event) => {
    if (!draggedLine) return;
    event.preventDefault();
    const target = event.target.closest('.poem-builder-line');
    if (target && target !== draggedLine) {
      const after = event.clientY > target.getBoundingClientRect().top + target.offsetHeight / 2;
      target.insertAdjacentElement(after ? 'afterend' : 'beforebegin', draggedLine);
    }
  });

  clear.addEventListener('click', function () {
    document.querySelectorAll('.line-heart.is-favorite').forEach((button) => {
      button.click();
    });
    localStorage.removeItem('favoriteLines.v1');
    sync();
  });

  copy.addEventListener('click', async function () {
    const poem = Array.from(output.querySelectorAll('.poem-builder-line-text')).map((line) => line.textContent).join('\n');
    try {
      await navigator.clipboard.writeText(poem);
      copy.textContent = 'Copied';
      window.setTimeout(() => { copy.textContent = 'Copy poem'; }, 1200);
    } catch (error) {
      copy.textContent = 'Copy unavailable';
    }
  });

  document.addEventListener('fieldnotes:changed', sync);
  sync();
}

function makePoemBuilderLine(text, custom) {
  const row = document.createElement('div');
  row.className = 'poem-builder-line';
  row.draggable = custom;
  const line = document.createElement('span');
  line.className = 'poem-builder-line-text';
  line.textContent = text;
  row.appendChild(line);
  if (custom) {
    row.classList.add('is-custom');
  }
  return row;
}

function initBodyResponses() {
  const dialog = document.querySelector('[data-response-dialog]');
  const openers = document.querySelectorAll('[data-response-open]');
  if (!dialog || !openers.length) return;

  const locations = ['Jaw', 'Throat', 'Chest', 'Gut', 'Back', 'Hands', 'Skin', 'Head', 'Somewhere else', 'Nowhere yet'];
  const options = dialog.querySelector('[data-response-options]');
  const submit = dialog.querySelector('[data-response-submit]');
  const status = dialog.querySelector('[data-response-status]');
  const results = dialog.querySelector('[data-response-results]');
  const endpoint = window.EMILY_BODY_RESPONSE_API || '';
  const voterKey = 'emily.body.responses.voter.v1';
  let voterId = localStorage.getItem(voterKey);
  if (!voterId) {
    voterId = window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
    localStorage.setItem(voterKey, voterId);
  }
  let activePiece = '';

  locations.forEach((location) => {
    const label = document.createElement('label');
    const input = document.createElement('input');
    const span = document.createElement('span');
    input.type = 'checkbox';
    input.value = location.toLowerCase().replace(/\s+/g, '-');
    span.textContent = location;
    label.append(input, span);
    options.appendChild(label);
  });

  const selected = function () {
    return Array.from(options.querySelectorAll('input:checked')).map((input) => input.value);
  };

  options.addEventListener('change', function () {
    submit.disabled = selected().length === 0;
  });

  openers.forEach((button) => {
    button.addEventListener('click', async function () {
      activePiece = button.dataset.responseOpen;
      options.querySelectorAll('input').forEach((input) => { input.checked = false; });
      submit.disabled = true;
      status.textContent = endpoint ? 'Choose every place that registered.' : 'The collective tally is being connected; the interface is ready, but responses are not being collected yet.';
      results.hidden = true;
      results.replaceChildren();
      dialog.showModal();
    });
  });

  submit.addEventListener('click', async function () {
    if (!endpoint || !activePiece) {
      status.textContent = 'Shared voting is not connected yet, so nothing was stored.';
      return;
    }
    submit.disabled = true;
    status.textContent = 'Adding your response…';
    try {
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ art_id: activePiece, locations: selected(), voter_id: voterId })
      });
      if (!response.ok) throw new Error('Vote request failed');
      const data = await response.json();
      renderBodyResponseResults(data, results);
      status.textContent = 'Your response joined the collective tally.';
    } catch (error) {
      status.textContent = 'The response could not be saved. Nothing was recorded,please try again later.';
      submit.disabled = false;
    }
  });
}

async function loadBodyResponseResults(endpoint, artId, results, status) {
  try {
    const response = await fetch(endpoint + '?art_id=' + encodeURIComponent(artId));
    if (!response.ok) throw new Error('Results request failed');
    renderBodyResponseResults(await response.json(), results);
    status.textContent = 'Vote to add your response and see where this piece landed for everyone.';
  } catch (error) {
    status.textContent = 'The collective tally is temporarily unavailable.';
  }
}

function renderBodyResponseResults(data, container) {
  const counts = data.counts || {};
  const max = Math.max(1, ...Object.values(counts));
  container.replaceChildren(...Object.entries(counts).map(([location, value]) => {
    const row = document.createElement('div');
    const label = document.createElement('span');
    const meter = document.createElement('span');
    const count = document.createElement('strong');
    label.textContent = location.replace(/-/g, ' ');
    row.className = 'body-response-meter';
    meter.className = 'body-response-meter-bar';
    meter.style.setProperty('--response-share', ((value / max) * 100) + '%');
    count.textContent = value;
    row.append(label, meter, count);
    return row;
  }));
  container.hidden = false;
}

function initRandomLines() {
  const panels = document.querySelectorAll('.random-line-panel');
  if (!panels.length) return;

  const poemLines = Array.from(document.querySelectorAll('.poem-line')).map((line) => {
    const textNode = line.querySelector('.poem-line-text');
    const poemBody = line.closest('.poem-body');

    return {
      text: textNode ? textNode.textContent.trim() : '',
      poem: poemBody ? poemBody.dataset.poemTitle : ''
    };
  }).filter((line) => line.text);

  if (!poemLines.length) return;

  panels.forEach((panel) => {
    const trigger = panel.querySelector('.random-line-trigger');
    const output = panel.querySelector('[data-random-output]');
    const source = panel.querySelector('[data-random-source]');

    if (!trigger || !output || !source) return;

    const setRandomLine = function () {
      const choice = poemLines[Math.floor(Math.random() * poemLines.length)];
      output.textContent = '"' + choice.text + '"';
      source.textContent = choice.poem ? 'from ' + choice.poem : '';
    };

    trigger.addEventListener('click', setRandomLine);
    setRandomLine();
  });
}

function initBlogListingMeta() {
  const cards = document.querySelectorAll('body.blog-page .card-attribution');
  if (!cards.length) return;

  cards.forEach((card) => {
    const author = card.querySelector('.listing-author');
    if (!author) return;

    const normalizedName = author.textContent.replace(/\s+/g, ' ').trim();
    if (normalizedName === 'Emily Miller') {
      author.hidden = true;
      card.classList.add('author-hidden');
    }
  });
}

function initPageCompanions() {
  const companions = document.querySelectorAll('[data-page-companion]');
  if (!companions.length) return;

  companions.forEach((figure) => {
    const image = figure.querySelector('img');
    if (!image) {
      figure.hidden = true;
      return;
    }

    const hideFigure = function () {
      figure.hidden = true;
    };

    const showFigure = function () {
      figure.hidden = false;
    };

    if (image.complete) {
      if (image.naturalWidth > 0) {
        showFigure();
      } else {
        hideFigure();
      }
    } else {
      image.addEventListener('load', showFigure, { once: true });
      image.addEventListener('error', hideFigure, { once: true });
    }
  });
}

function initResearchBackgrounds() {
  const stage = document.querySelector('.research-bg-stage');
  const sections = Array.from(document.querySelectorAll('.research-bg-trigger[data-bg-id]'));
  const backgrounds = Array.from(document.querySelectorAll('.research-bg-stage .research-bg[data-bg-id]'));

  if (!stage || !sections.length || !backgrounds.length) return;

  let frameId = null;

  const applyBlend = function () {
    frameId = null;

    const viewportMid = window.innerHeight / 2;
    const influenceRange = window.innerHeight * 0.9;
    const scoresById = new Map();

    sections.forEach((section) => {
      const rect = section.getBoundingClientRect();
      const sectionMid = rect.top + rect.height / 2;
      const distance = Math.abs(sectionMid - viewportMid);
      const score = Math.max(0, 1 - (distance / influenceRange));
      const bgId = section.dataset.bgId;

      if (!bgId) return;

      const currentScore = scoresById.get(bgId) || 0;
      scoresById.set(bgId, Math.max(currentScore, score));
    });

    const ranked = Array.from(scoresById.entries())
      .map(([bgId, score]) => ({ bgId, score }))
      .sort((a, b) => b.score - a.score);

    const top = ranked[0];
    const second = ranked[1];
    const weights = new Map();

    if (!top || top.score <= 0.001) {
      weights.set('neutral', 1);
    } else if (!second || second.score <= 0.001) {
      weights.set(top.bgId, 1);
    } else {
      const total = top.score + second.score;
      weights.set(top.bgId, top.score / total);
      weights.set(second.bgId, second.score / total);
    }

    backgrounds.forEach((background) => {
      const weight = weights.get(background.dataset.bgId) || 0;
      background.style.opacity = weight.toFixed(3);
    });
  };

  const requestBlend = function () {
    if (frameId !== null) return;
    frameId = window.requestAnimationFrame(applyBlend);
  };

  requestBlend();
  window.addEventListener('scroll', requestBlend, { passive: true });
  window.addEventListener('resize', requestBlend);
}

function initHashLandingAdjustments() {
  if (!document.body.classList.contains('research-page') || !window.location.hash) return;

  const header = document.querySelector('header.fixed-top');
  const target = getHashTarget(window.location.hash);

  if (!header || !target) return;

  const showHeader = function () {
    header.classList.add('headroom--pinned');
    header.classList.remove('headroom--unpinned');
  };

  let headroomFrozen = false;

  const freezeHeader = function () {
    if (headroomFrozen || typeof window.quartoToggleHeadroom !== 'function') return;
    window.quartoToggleHeadroom();
    headroomFrozen = true;
  };

  const unfreezeHeader = function () {
    if (!headroomFrozen || typeof window.quartoToggleHeadroom !== 'function') return;
    window.quartoToggleHeadroom();
    headroomFrozen = false;
  };

  const landOnTarget = function () {
    showHeader();
    window.requestAnimationFrame(function () {
      target.scrollIntoView({ block: 'start', inline: 'nearest' });
      window.requestAnimationFrame(function () {
        showHeader();
        freezeHeader();
      });
    });
  };

  const releaseOnFirstScroll = function () {
    window.removeEventListener('scroll', releaseOnFirstScroll);
    unfreezeHeader();
  };

  landOnTarget();
  window.setTimeout(landOnTarget, 140);
  window.setTimeout(function () {
    window.addEventListener('scroll', releaseOnFirstScroll, { once: true, passive: true });
  }, 260);
}

function getHashTarget(hash) {
  const id = decodeURIComponent(hash.replace(/^#/, ''));
  if (!id) return null;

  const byId = document.getElementById(id);
  if (byId) return byId;

  try {
    return document.querySelector(hash);
  } catch (error) {
    return null;
  }
}

function initQuoteFadeIn() {
  const quoteSection = document.querySelector('body.home-page .quote-section');
  if (!quoteSection) return;

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (prefersReducedMotion) {
    quoteSection.classList.add('is-visible');
    return;
  }

  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('is-visible');
      observer.unobserve(entry.target);
    });
  }, {
    threshold: 0.2,
    rootMargin: '0px 0px -12% 0px'
  });

  observer.observe(quoteSection);
}

function initBirdSeparators() {
  const separators = document.querySelectorAll('[data-bird-separator]');
  if (!separators.length) return;

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (prefersReducedMotion) {
    separators.forEach((separator) => separator.classList.add('is-startled'));
    return;
  }

  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('is-startled');
      observer.unobserve(entry.target);
    });
  }, {
    threshold: 0.5,
    rootMargin: '0px 0px -8% 0px'
  });

  separators.forEach((separator) => observer.observe(separator));
}
</script>
